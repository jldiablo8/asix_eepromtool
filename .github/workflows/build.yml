name: Build Windows EXE

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64 p7zip-full curl

      - name: Download and extract libusb
        run: |
          curl -L -o libusb.7z https://github.com/libusb/libusb/releases/download/v1.0.27/libusb-1.0.27.7z
          7z x libusb.7z -olibusb

      - name: Patch C code for Windows
        run: |
          # Replace Linux networking headers
          sed -i 's/<arpa\/inet.h>/<winsock2.h>/g' asix_eepromtool.c
          sed -i 's/<netinet\/in.h>//g' asix_eepromtool.c
          
          # Replace <endian.h> with Windows/GCC byte-swap definitions
          sed -i 's/#include <endian.h>/#define htobe16(x) __builtin_bswap16(x)\n#define be16toh(x) __builtin_bswap16(x)\n#define htole16(x) (x)\n#define le16toh(x) (x)/g' asix_eepromtool.c

      - name: Compile asix_eepromtool
        run: |
          x86_64-w64-mingw32-gcc asix_eepromtool.c -o asix_eepromtool.exe \
            -Ilibusb/include \
            -Ilibusb/include/libusb-1.0 \
            -Llibusb/MinGW64/static \
            -lusb-1.0 -lsetupapi -lole32 -ladvapi32 -lws2_32 -static

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: asix_eepromtool-win7
          path: asix_eepromtool.exe
